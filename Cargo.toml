[package]
name = "haricot"
version = "1.0.1"
edition = "2024"
# The toolchain the manuscript builds used and rust-toolchain.toml pins; the code needs at least 1.88 (let chains).
rust-version = "1.96"
description = "Assembles genomes directly from raw nanopore signals, without basecalling, with a fuzzy de Bruijn graph over e-mers"
license = "MIT"
repository = "https://github.com/STORMgroup/HARICOT"
readme = "README.md"

# Binaries (auto-discovered): `haricot` (src/main.rs) and one program per file of src/bin/, named after it: the steps
# `haricot assemble` runs, `haricot-ovl-filter` (used by the checks) and the truth programs. `cargo build --release`
# puts every binary in target/release.

[lib]
name = "haricot"
path = "src/lib.rs"

[dependencies]
# Raw signal I/O: pod5 (pure-Rust reader, no system deps).
pod5lib = { git = "https://github.com/Psy-Fer/pod5lib-rs", rev = "4e77fe824201e52ea41f98fb4eaeb0ace6e215ef" }
# CLI, errors.
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Fast non-cryptographic hash maps for seed indexing.
rustc-hash = "2"
# Data parallelism (per read, per read pair, per row).
rayon = "1"
# Multithreaded allocator (see the `#[global_allocator]` in lib.rs). The overlap
# detection allocates a scratch `Vec<f64>` per slope evaluation per read pair -- ~1.2e9
# short-lived allocations on a 30x E. coli set -- and glibc arena locking makes that the
# scaling limit of an otherwise embarrassingly parallel phase.
mimalloc = { version = "0.1", default-features = false }
# Serialization (derive) of the candidate cache the pipeline steps pass on.
serde = { version = "1", features = ["derive"] }
# Cache overlaps to disk (haricot-detect --save-overlaps) for the later steps.
bincode = "1"
# `haricot assemble`: per-step resource use of the pipeline programs (wait4) and the forests' SHA-256.
libc = "0.2"
sha2 = "0.10"

[lints.clippy]
# Nested `if`s stay as written; clippy would merge them into let chains.
collapsible_if = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# Arrow IPC reader that accepts delta dictionary batches (pod5s written by the Python pod5 writer over
# several runs carry them; upstream arrow-ipc 53.4.1 rejects them). Upstream 53.4.1 plus one patch:
# vendor/README.md.
[patch.crates-io]
arrow-ipc = { path = "vendor/arrow-ipc" }
